name: Build Jawaker Bot APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""
          for candidate in \
            "$GITHUB_WORKSPACE/JawakerBot_clean_FIXED.zip" \
            "$GITHUB_WORKSPACE/JawakerBot_clean.zip"; do
            if [ -f "$candidate" ]; then
              ZIP_FILE="$candidate"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Project ZIP was not found. Expected JawakerBot_clean_FIXED.zip or JawakerBot_clean.zip in the repository root."
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -print
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/jawaker_project"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q -o "$ZIP_FILE" -d "$EXTRACT_DIR"

          APP_GRADLE="$(find "$EXTRACT_DIR" -type f -path '*/app/build.gradle.kts' -print -quit)"
          if [ -z "$APP_GRADLE" ]; then
            echo "::error::The ZIP does not contain app/build.gradle.kts."
            find "$EXTRACT_DIR" -maxdepth 7 -type f -print
            exit 1
          fi

          PROJECT_DIR="${APP_GRADLE%/app/build.gradle.kts}"
          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

          test -f "$GITHUB_WORKSPACE/settings.gradle.kts"
          test -f "$GITHUB_WORKSPACE/app/build.gradle.kts"
          test -d "$GITHUB_WORKSPACE/app/src"

          echo "Using project archive: $ZIP_FILE"
          echo "Android Gradle Plugin and Kotlin versions from app/build.gradle.kts:"
          grep -E 'com\.android\.application|org\.jetbrains\.kotlin\.android' "$GITHUB_WORKSPACE/app/build.gradle.kts"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JawakerBot_v2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
