name: Build Jawaker Bot APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP if present
        run: |
          if [ -f "JawakerBot_clean.zip" ]; then
            unzip -o JawakerBot_clean.zip
          fi
          find . -name "*.gradle*" -exec sed -i '/jcenter()/d' {} +

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JawakerBot_v2
          path: app/build/outputs/apk/debug/app-debug.apk
